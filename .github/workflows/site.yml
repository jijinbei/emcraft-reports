# The reports' site: each published report compiled to PDF (from the results kept in the
# repository: nothing is solved here) and the index listing them, on GitHub Pages
# (site.jijinbei.jp/emcraft-reports/).
name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # each report's last change, for its date
      - uses: astral-sh/setup-uv@v6
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.1
      - name: Fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-noto-cjk
      - name: Build
        run: uv run report site --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
