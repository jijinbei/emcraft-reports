[project]
name = "emcraft-reports"
version = "0.1.0"
description = "Engineering analysis reports made with EMCraft, and the tool that builds them"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pillow>=11"]

[project.scripts]
report = "emreports.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emreports"]
